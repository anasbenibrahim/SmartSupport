services:
  # 1. Base de données PostgreSQL pour l'Auth Service
  postgres:
    image: postgres:latest
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d auth_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - microservices-net

  user-postgres:
    image: postgres:latest
    container_name: user-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: user_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d user_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - microservices-net

  # 2. Discovery Service (Eureka)
  discovery-service:
    build: ./discovery-service
    container_name: discovery-service
    ports:
      - "8761:8761"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8761/eureka/apps >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - microservices-net

  # 3. Config Server
  config-server:
    build: ./config-server
    container_name: config-server
    ports:
      - "8888:8888"
    volumes:
      - ./smartsupport-config-repo:/config-repo:ro
    depends_on:
      discovery-service:
        condition: service_healthy
    environment:
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://discovery-service:8761/eureka/
      - EUREKA_INSTANCE_HOSTNAME=config-server
      - CONFIG_REPO_PATH=/config-repo
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8888/api-gateway/default >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - microservices-net

  # 3. API Gateway
  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    ports:
      - "8090:8090"
    depends_on:
      discovery-service:
        condition: service_healthy
      config-server:
        condition: service_healthy
    environment:
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://discovery-service:8761/eureka/
      - EUREKA_INSTANCE_HOSTNAME=api-gateway
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
    networks:
      - microservices-net

  # 4. Auth Service
  auth-service:
    build: ./auth-service
    container_name: auth-service
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
      config-server:
        condition: service_healthy
    environment:
      - SERVER_PORT=8081
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/auth_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - ADMIN_EMAIL=admin@smartsupport.local
      - ADMIN_PASSWORD=Admin@12345
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://discovery-service:8761/eureka/
      - EUREKA_INSTANCE_HOSTNAME=auth-service
      - SPRING_CLOUD_CONFIG_ENABLED=true
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health | grep -q 'UP'"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - microservices-net

  # 5. User Service
  user-service:
    build: ./user-service
    container_name: user-service
    ports:
      - "3031:3031"
    depends_on:
      user-postgres:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
      config-server:
        condition: service_healthy
    environment:
      - SERVER_PORT=3031
      - SPRING_DATASOURCE_URL=jdbc:postgresql://user-postgres:5432/user_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://discovery-service:8761/eureka/
      - EUREKA_INSTANCE_HOSTNAME=user-service
      - SPRING_CLOUD_CONFIG_ENABLED=true
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3031/actuator/health | grep -q 'UP'"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - microservices-net

networks:
  microservices-net:
    driver: bridge

volumes:
  maven-repo: