services:
  # 1. Base de données PostgreSQL pour l'Auth Service
  postgres:
    image: postgres:latest
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d auth_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - microservices-net

  user-postgres:
    image: postgres:latest
    container_name: user-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: user_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d user_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - microservices-net

  # 2. Discovery Service (Eureka)
  discovery-service:
    build: ./discovery-service
    container_name: discovery-service
    ports:
      - "8761:8761"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8761/eureka/apps >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - microservices-net

  # 3. Config Server
  config-server:
    build: ./config-server
    container_name: config-server
    ports:
      - "8888:8888"
    volumes:
      - ./smartsupport-config-repo:/config-repo:ro
    depends_on:
      discovery-service:
        condition: service_healthy
    environment:
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://discovery-service:8761/eureka/
      - EUREKA_INSTANCE_HOSTNAME=config-server
      - CONFIG_REPO_PATH=/config-repo
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8888/api-gateway/default >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - microservices-net

  # 3. API Gateway
  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    ports:
      - "8090:8090"
    depends_on:
      discovery-service:
        condition: service_healthy
      config-server:
        condition: service_healthy
    environment:
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://discovery-service:8761/eureka/
      - EUREKA_INSTANCE_HOSTNAME=api-gateway
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
    networks:
      - microservices-net

  # 4. Auth Service
  auth-service:
    build: ./auth-service
    container_name: auth-service
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
      config-server:
        condition: service_healthy
    environment:
      - SERVER_PORT=8081
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/auth_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - NOTIFICATION_INTERNAL_SECRET=local-notification-secret
      - JWT_SECRET=5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437
      - ADMIN_EMAIL=admin@smartsupport.local
      - ADMIN_PASSWORD=Admin@12345
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://discovery-service:8761/eureka/
      - EUREKA_INSTANCE_HOSTNAME=auth-service
      - SPRING_CLOUD_CONFIG_ENABLED=true
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health | grep -q 'UP'"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - microservices-net

  # 5. User Service
  user-service:
    build: ./user-service
    container_name: user-service
    ports:
      - "3031:3031"
    depends_on:
      user-postgres:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
      config-server:
        condition: service_healthy
    environment:
      - SERVER_PORT=3031
      - SPRING_DATASOURCE_URL=jdbc:postgresql://user-postgres:5432/user_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - NOTIFICATION_INTERNAL_SECRET=local-notification-secret
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://discovery-service:8761/eureka/
      - EUREKA_INSTANCE_HOSTNAME=user-service
      - SPRING_CLOUD_CONFIG_ENABLED=true
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3031/actuator/health | grep -q 'UP'"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - microservices-net

  notification-postgres:
    image: postgres:latest
    container_name: notification-postgres
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: notification_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d notification_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - microservices-net

  notification-service:
    build: ./notification-service
    container_name: notification-service
    ports:
      - "4040:4040"
    depends_on:
      notification-postgres:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
      config-server:
        condition: service_healthy
    environment:
      - SERVER_PORT=4040
      - SPRING_DATASOURCE_URL=jdbc:postgresql://notification-postgres:5432/notification_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - MAIL_HOST=smtp.gmail.com
      - MAIL_PORT=587
      - MAIL_USERNAME=${MAIL_USERNAME:-}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-}
      - MAIL_SMTP_AUTH=true
      - MAIL_SMTP_STARTTLS=true
      - NOTIFICATION_INTERNAL_SECRET=local-notification-secret
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://discovery-service:8761/eureka/
      - EUREKA_INSTANCE_HOSTNAME=notification-service
      - SPRING_CLOUD_CONFIG_ENABLED=true
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4040/actuator/health | grep -q 'UP'"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - microservices-net

  ticket-postgres:
    image: postgres:latest
    container_name: ticket-postgres
    ports:
      - "5435:5432"
    environment:
      POSTGRES_DB: ticket_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ticket_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - microservices-net

  ticket-service:
    build: ./ticket-service
    container_name: ticket-service
    ports:
      - "3032:3032"
    depends_on:
      ticket-postgres:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
      config-server:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    environment:
      - SERVER_PORT=3032
      - SPRING_DATASOURCE_URL=jdbc:postgresql://ticket-postgres:5432/ticket_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - JWT_SECRET=5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437
      - AI_SERVICE_URL=http://ai-service:5000
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://discovery-service:8761/eureka/
      - EUREKA_INSTANCE_HOSTNAME=ticket-service
      - SPRING_CLOUD_CONFIG_ENABLED=true
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3032/actuator/health | grep -q 'UP'"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - microservices-net

  ai-service:
    build: ./ai-service
    container_name: ai-service
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - WORKERS=2
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - microservices-net

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: smart-support-client
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8090
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      api-gateway:
        condition: service_started
    networks:
      - microservices-net

networks:
  microservices-net:
    driver: bridge

volumes:
  maven-repo: