global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Spring Boot services — requires the micrometer-registry-prometheus
  # dependency in each service's pom.xml/build.gradle, and
  # management.endpoints.web.exposure.include=prometheus in application.yml
  # (or the equivalent env var) so /actuator/prometheus is exposed.
  - job_name: "discovery-service"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["discovery-service:8761"]

  - job_name: "config-server"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["config-server:8888"]

  - job_name: "api-gateway"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["api-gateway:8090"]

  - job_name: "auth-service"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["auth-service:8081"]

  - job_name: "user-service"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["user-service:3031"]

  - job_name: "notification-service"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["notification-service:4040"]

  - job_name: "ticket-service"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["ticket-service:3032"]

  # ai-service is Python/Flask (per its healthcheck) — add a job here only
  # if it exposes a /metrics endpoint via prometheus_client or similar.
  # - job_name: "ai-service"
  #   metrics_path: /metrics
  #   static_configs:
  #     - targets: ["ai-service:5000"]
